; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

lib_deps =
        https://github.com/pedvide/ADC.git
        https://github.com/tonton81/FlexCAN_T4.git
        https://github.com/JonHub/Filters.git
        https://github.com/tomdebree/Serial_CAN_Teensy.git
        https://github.com/tonton81/WDT_T4.git
        https://github.com/PaulStoffregen/Time.git
        adafruit/Adafruit SSD1306 @ ^2.5.15
        https://github.com/ftrias/TeensyDebug/archive/refs/heads/master.zip

; Optimize for debugging (turns off some compiler optimizations that make stepping jumpy)
; build_type = debug

; Enable Dual Serial (One for monitoring, one for the debugger)
build_flags = 
    -DUSB_DUAL_SERIAL
    -DDEBUG
    -g
    -I src

; Tell PlatformIO to use a custom debug tool (the stub)
debug_tool = custom
debug_port = \\.\COM12  ; <--- IMPORTANT: You must change this to your Teensy's 2nd COM port!
debug_load_mode = manual
debug_server = 
debug_init_cmds = 
    target extended-remote $DEBUG_PORT
    $INIT_BREAK
    define pio_reset_run_target
        interrupt
        tbreak loop
        continue
    end
    define pio_restart_target
        echo Restart is not supported with GDB Stub
    end